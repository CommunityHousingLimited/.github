name: Defect
description: Report something that is not working as expected
title: "[Defect] "
body:
  - type: markdown
    attributes:
      value: Do not use this form for a security vulnerability. Follow the security policy.
  - type: textarea
    id: summary
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive information
      options:
        - label: This report contains no credentials, customer information or personal information.
          required: true
